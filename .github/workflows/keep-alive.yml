name: Keep Render awake

# Render's free tier spins the web service down after ~15 min of no traffic,
# which makes the first visitor wait 20-30s. A light ping every 10 min avoids that.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: curl -fsS -m 60 --retry 3 --retry-delay 10 -o /dev/null https://littlemove.onrender.com/robots.txt
