databases:
  - name: littlemove-db
    databaseName: littlemove
    user: littlemove_user
    plan: free

services:
  - type: web
    name: littlemove-store
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: littlemove-db
          property: connectionString
      # Set these manually in the Render dashboard:
      # CLOUDINARY_URL          — from your free Cloudinary account
      # DJANGO_SUPERUSER_USERNAME — first admin login
      # DJANGO_SUPERUSER_EMAIL
      # DJANGO_SUPERUSER_PASSWORD
      # ADMIN_URL               — e.g. my-secret-panel/
      # ALLOWED_HOSTS           — your custom domain if you have one (Render subdomain is auto-added)
