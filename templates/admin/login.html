{% extends 'admin/login.html' %}

{% block login_after %}
{% if ENABLE_GOOGLE_TRANSLATE %}
<div class="lm-login-lang" style="text-align:center;margin-top:16px">
  <select aria-label="Language" onchange="lmAdminGTChange(this.value)"
          style="font-size:.875rem;padding:6px 12px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer">
    <option value="">🌐 Language</option>
    {% for code, native, english, rtl in GT_LANGUAGES %}
    <option value="{{ code }}" {% if code == current_gt_lang %}selected{% endif %}>{{ native }} — {{ english }}</option>
    {% endfor %}
    {% if current_gt_lang %}<option value="__reset__">↩ Show English</option>{% endif %}
  </select>
  <script>
  function lmAdminGTChange(code) {
    if (!code) return;
    if (code === '__reset__') {
      ['lm_gt_lang','googtrans'].forEach(function(n){
        document.cookie=n+'=;path=/;max-age=0';
        document.cookie=n+'=;path=/;max-age=0;domain='+location.hostname;
      });
      location.reload(); return;
    }
    document.cookie='googtrans=/en/'+code+';path=/';
    document.cookie='googtrans=/en/'+code+';path=/;domain='+location.hostname;
    document.cookie='lm_gt_lang='+code+';path=/;max-age='+(365*24*3600)+';samesite=Lax';
    location.reload();
  }
  </script>
</div>
{% endif %}
{% endblock %}
