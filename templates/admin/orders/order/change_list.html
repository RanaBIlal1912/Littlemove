{% extends "admin/change_list.html" %}

{% block content %}
<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">
  {% for tab in order_tabs %}
  <a href="{{ tab.url }}"
     style="display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:99px;
            font-size:.82rem;font-weight:600;text-decoration:none;white-space:nowrap;
            border:2px solid {% if tab.active %}#3b82f6{% else %}#e5e7eb{% endif %};
            background:{% if tab.active %}#eff6ff{% else %}#fff{% endif %};
            color:{% if tab.active %}#1d4ed8{% else %}#374151{% endif %}">
    {{ tab.label }}
    {% if tab.count > 0 %}
    <span style="background:{% if tab.active %}#3b82f6{% else %}#e5e7eb{% endif %};
                 color:{% if tab.active %}#fff{% else %}#374151{% endif %};
                 border-radius:99px;padding:1px 7px;font-size:.75rem">{{ tab.count }}</span>
    {% endif %}
  </a>
  {% endfor %}
</div>
{{ block.super }}
{% endblock %}
