{% extends "admin/base.html" %}

{% block extrahead %}
{{ block.super }}
{% if ENABLE_GOOGLE_TRANSLATE and current_gt_lang %}
<div id="google_translate_element" style="display:none" aria-hidden="true"></div>
<script>
window._lm_gt_active = '{{ current_gt_lang }}';
window.googleTranslateElementInit = function() {
  new google.translate.TranslateElement({pageLanguage:'en',autoDisplay:false},'google_translate_element');
};
</script>
<script src="//translate.googleapis.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
{% endif %}
{% if ENABLE_GOOGLE_TRANSLATE %}
<style>
.goog-te-banner-frame,.skiptranslate,#google_translate_element,.goog-te-gadget{display:none!important}
body{top:0!important}
font{font-family:inherit}
</style>
{% endif %}
{% endblock %}
