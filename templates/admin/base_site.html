{% extends "admin/base.html" %}

{% block extrahead %}
{{ block.super }}
{% if ENABLE_GOOGLE_TRANSLATE and current_gt_lang %}
<div id="google_translate_element" style="display:none" aria-hidden="true"></div>
<script>
window._lm_gt_active = '{{ current_gt_lang }}';
window.googleTranslateElementInit = function() {
  new google.translate.TranslateElement({pageLanguage:'en',autoDisplay:false},'google_translate_element');
};
</script>
<script src="//translate.googleapis.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
{% endif %}
{% if ENABLE_GOOGLE_TRANSLATE %}
<style>
.goog-te-banner-frame,.skiptranslate,#google_translate_element,.goog-te-gadget{display:none!important}
body{top:0!important}
font{font-family:inherit}
</style>
{% endif %}
{% endblock %}

{% block userlinks %}
{% if ENABLE_GOOGLE_TRANSLATE %}
<div class="lm-admin-lang" style="display:inline-flex;align-items:center;gap:6px;margin-inline-end:8px">
  <select id="admin-gt-select" aria-label="Language" onchange="adminGTChange(this.value)"
          style="font-size:.8125rem;background:transparent;color:inherit;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:3px 6px;cursor:pointer">
    <option value="" class="notranslate">&#x1F310; Language</option>
    {% for code, native, english, rtl in GT_LANGUAGES %}
    <option value="{{ code }}" {% if code == current_gt_lang %}selected{% endif %} class="notranslate">{{ native }} — {{ english }}</option>
    {% endfor %}
    {% if current_gt_lang %}<option value="__reset__" class="notranslate">&#x21A9; Show original (English)</option>{% endif %}
  </select>
  <script>
  function adminGTChange(code) {
    if (!code) return;
    if (code === '__reset__') {
      document.cookie='lm_gt_lang=;path=/;max-age=0';
      document.cookie='lm_gt_lang=;path=/;max-age=0;domain='+location.hostname;
      document.cookie='googtrans=;path=/;max-age=0';
      document.cookie='googtrans=;path=/;max-age=0;domain='+location.hostname;
      document.cookie='django_language=en;path=/;max-age='+(365*24*3600);
      location.reload(); return;
    }
    var d=location.hostname;
    document.cookie='googtrans=/en/'+code+';path=/';
    document.cookie='googtrans=/en/'+code+';path=/;domain='+d;
    document.cookie='lm_gt_lang='+code+';path=/;max-age='+(365*24*3600)+';samesite=Lax';
    document.cookie='django_language=en;path=/;max-age='+(365*24*3600);
    location.reload();
  }
  </script>
</div>
{% endif %}
{{ block.super }}
{% endblock %}
